# Paperwing desktop packaging (https://www.electron.build)
appId: app.paperwing.desktop
productName: Paperwing
copyright: Copyright © 2026 Rohan Vijaykumar · PDF engine © BentoPDF contributors

directories:
  output: release
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  - print.cjs
  - engines.json
  - package.json

# The web app (built from the repository root into ../dist) ships unpacked
# next to the executable and is served through the app:// protocol.
extraResources:
  - from: ../dist
    to: web
    filter:
      - '**/*'
      - '!**/*.map'
      # LibreOffice (~77 MB, used only by the Office → PDF tools) is
      # downloaded on first use instead; see scripts/engine-info.mjs.
      - '!libreoffice-wasm/soffice.wasm.gz'
      - '!libreoffice-wasm/soffice.data.gz'
  - from: ../LICENSE
    to: LICENSE.txt
  - from: ../NOTICE.md
    to: NOTICE.md

fileAssociations:
  - ext: pdf
    # Also the Windows ProgID; build/installer.nsh refers to it. Don't rename:
    # it would break Paperwing as the default PDF app for existing users.
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Editor

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Where the Windows installer looks for updates (electron-updater). The
# release workflow attaches latest.yml and the blockmaps to each release.
publish:
  - provider: github
    owner: rohanvijaykumar
    repo: paperwing

# Keep the download small: English UI strings only, best compression, and
# drop Chromium components Paperwing never uses (see scripts/after-pack.cjs).
electronLanguages: [en-US, en]
compression: maximum
afterPack: scripts/after-pack.cjs

win:
  # Platform icons come from build/icon.svg (scripts/gen-icons.mjs)
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    # The portable build. (A self-extracting "portable" .exe was dropped: it
    # unpacks the whole app on every launch, which takes 30+ seconds.)
    - target: zip
      arch: [x64]
  artifactName: ${productName}-Portable-${version}-win-x64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Paperwing
  artifactName: ${productName}-Setup-${version}-x64.${ext}
  license: ../LICENSE
  # Registers the File Explorer PDF thumbnail provider (see build/installer.nsh)
  include: build/installer.nsh

mac:
  icon: build/icon-mac.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signed (no Apple Developer ID). Set CSC_LINK/CSC_KEY_PASSWORD and
  # replace identity to ship a notarised build.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  # Take effect once hardenedRuntime is enabled for a signed, notarised build
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Paperwing opens and saves PDF files you choose.
    NSDownloadsFolderUsageDescription: Paperwing saves exported files to your Downloads folder.

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

linux:
  icon: build/icon-linux.png
  category: Office
  target:
    - AppImage
  synopsis: Free, open-source PDF editor
