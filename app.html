<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Paperwing</title>
    <link rel="icon" href="/paperwing.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/acro/app.css" />
    <script>
      // Apply a saved light/dark override before first paint
      try {
        var t = localStorage.getItem('paperwing:theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header id="titlebar">
      <button
        type="button"
        class="tb-btn tb-menu"
        id="menu-btn"
        data-icon="menu"
      >
        <span>Menu</span>
      </button>
      <button
        type="button"
        class="tb-btn tb-home"
        id="home-btn"
        data-icon="home"
        title="Home"
        aria-label="Home"
      ></button>
      <div id="tabs" role="tablist"></div>
      <button type="button" class="tb-create" id="create-btn" data-icon="plus">
        <span>Create</span>
      </button>
      <div class="tb-drag"></div>
      <button
        type="button"
        class="tb-btn"
        id="help-btn"
        data-icon="help"
        title="Help"
        aria-label="Help"
      ></button>
      <div id="win-controls"></div>
    </header>

    <main id="views">
      <!-- Home -->
      <section id="view-home" class="view">
        <div class="home-welcome">
          <div class="home-brand">
            <span class="app-logo"></span>
            <span>Welcome to Paperwing.</span>
          </div>
          <label class="home-search" data-icon="search">
            <input
              id="home-search"
              type="search"
              placeholder="Search"
              autocomplete="off"
            />
          </label>
        </div>
        <div class="home-body">
          <div class="home-main">
            <div class="home-glow"></div>
            <div class="rec-head">
              <h2>Recommended tools for you</h2>
              <button type="button" class="pill-btn" id="see-all-tools">
                See all tools
              </button>
            </div>
            <div class="rec-row">
              <div class="drop-card" id="home-drop">
                <div class="drop-inner">
                  <div class="drop-title">Open a PDF to get started</div>
                  <div class="drop-sub">Drag and drop a file here, or</div>
                  <button type="button" class="accent-btn" id="home-select">
                    Select a file
                  </button>
                </div>
              </div>
              <div class="rec-tools" id="rec-tools"></div>
            </div>
            <div class="recent-head">
              <div class="home-tabs" role="tablist" aria-label="Files">
                <button
                  type="button"
                  role="tab"
                  class="ht-btn is-active"
                  data-home-tab="recent"
                  aria-selected="true"
                >
                  Recent
                </button>
                <button
                  type="button"
                  role="tab"
                  class="ht-btn"
                  data-home-tab="starred"
                  aria-selected="false"
                >
                  Starred
                </button>
              </div>
              <div class="view-toggle">
                <button
                  type="button"
                  class="quiet-btn"
                  id="clear-recent"
                  hidden
                >
                  Clear recent
                </button>
                <button
                  type="button"
                  class="vt-btn is-active"
                  data-layout="list"
                  data-icon="list"
                  title="List view"
                  aria-label="List view"
                ></button>
                <button
                  type="button"
                  class="vt-btn"
                  data-layout="grid"
                  data-icon="grid"
                  title="Thumbnail view"
                  aria-label="Thumbnail view"
                ></button>
              </div>
            </div>
            <div id="recent-list" class="recent-list"></div>
          </div>
        </div>
      </section>

      <!-- Document -->
      <section id="view-doc" class="view">
        <div id="globalbar">
          <nav class="gb-tabs" id="gb-tabs">
            <button type="button" data-panel="all" class="is-active">
              All tools
            </button>
            <button type="button" data-panel="edit">Edit</button>
            <button type="button" data-panel="convert">Convert</button>
            <button type="button" data-panel="sign">E-Sign</button>
          </nav>
          <div class="gb-actions">
            <button
              type="button"
              class="gb-find"
              id="find-btn"
              data-icon-after="search"
            >
              Find text or tools
            </button>
            <span class="gb-sep"></span>
            <button
              type="button"
              class="tb-btn"
              id="save-btn"
              data-icon="save"
              title="Save (Ctrl+S)"
              aria-label="Save"
            ></button>
            <button
              type="button"
              class="tb-btn"
              id="print-btn"
              data-icon="print"
              title="Print (Ctrl+P)"
              aria-label="Print"
            ></button>
            <button type="button" class="dark-pill" id="download-btn">
              Download
            </button>
          </div>
        </div>
        <div id="doc-body">
          <aside id="left-panel"></aside>
          <div id="doc-stage">
            <div id="viewer-host"></div>
            <div id="doc-empty">
              <div class="de-card">
                <div class="de-title">
                  Pick a tool, or open a PDF to work on
                </div>
                <div class="de-sub">
                  Search every tool in the panel on the left, or drop files
                  anywhere.
                </div>
                <button type="button" class="accent-btn" id="doc-empty-open">
                  Select a file
                </button>
              </div>
            </div>
            <div id="quickbar"></div>
            <div id="tool-full"></div>
          </div>
          <aside id="right-rail"></aside>
        </div>
      </section>
    </main>

    <div id="drop-overlay"><div>Drop files to open them</div></div>
    <div id="popover-layer"></div>
    <div id="toasts"></div>
    <input
      type="file"
      id="open-input"
      accept="application/pdf,.pdf"
      multiple
      hidden
    />

    <script type="module" src="/src/acro/app.ts"></script>
  </body>
</html>
