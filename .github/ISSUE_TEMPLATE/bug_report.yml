name: 🐛 Bug report
description: Something in Paperwing doesn't work as expected
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF
        2. Choose Edit ▸ Add watermark
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paperwing version
      description: Menu ▸ About Paperwing
      placeholder: '1.1.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows installer
        - Windows portable (.zip)
        - macOS .dmg
        - Built from source
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, sample file or logs
      description: Drag files here. A PDF that shows the problem helps a lot (only share files you're allowed to).
