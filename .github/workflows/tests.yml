name: Tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

  # The File Explorer thumbnail provider (desktop/native/win-thumbnails):
  # builds it and renders real PDFs through it the way Explorer does
  windows-thumbnails:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and test
        shell: pwsh
        run: desktop/native/win-thumbnails/build.ps1 -Test

  # Signing with certificates in the Windows store (desktop/native/win-certs):
  # the helper's own tests, then test IDs whose keys can't be exported (as on
  # a smart card): RSA, ECDSA P-256/384/521, an older CryptoAPI key, and a
  # login-only and an expired one that mustn't sign. Real PDFs are signed
  # through the helper and each is checked by pyHanko and OpenSSL as well as
  # Paperwing's own validator; then the real app signs with real clicks.
  windows-certs:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HUSKY: 0
      BENCH_TMP: ${{ github.workspace }}/../bench-tmp
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix desktop
          mkdir -p "$BENCH_TMP"

      - name: Build and test the certificate helper
        shell: pwsh
        run: desktop/native/win-certs/build.ps1 -Test

      - name: Bridge tests
        run: node --test desktop/tests/certs.test.mjs

      - name: Create test IDs in the certificate store
        shell: powershell
        run: desktop/native/win-certs/test-certs.ps1 -Create -Out "$env:RUNNER_TEMP\certs.json"

      - name: Sign PDFs through the helper
        shell: bash
        env:
          PW_CERTS_HELPER: ${{ github.workspace }}\desktop\native\win-certs\out\paperwing-certs.exe
          PW_TEST_CERTS: ${{ runner.temp }}\certs.json
          PW_SIGNED_OUT: ${{ runner.temp }}\signed
        run: npx vitest run src/tests/paperwing-cert-helper.test.ts src/tests/paperwing-pdf-sign.test.ts src/tests/paperwing-cms.test.ts

      - name: Check every signed PDF with pyHanko
        shell: bash
        run: |
          python -m pip install --quiet "pyHanko==0.29.1"
          python desktop/tests/validate-signed.py "$RUNNER_TEMP/signed"

      - name: Check every signed PDF with OpenSSL
        shell: bash
        run: node desktop/tests/openssl-verify.mjs "$RUNNER_TEMP/signed"

      - name: Build the web app
        working-directory: desktop
        run: npm run build:web

      - name: Digitally sign in the real app
        working-directory: desktop
        shell: bash
        env:
          PW_TEST_CERTS: ${{ runner.temp }}\certs.json
          PW_SIGNED_OUT: ${{ runner.temp }}\app-signed
          PW_SCREENS: ${{ runner.temp }}\cert-screens
        run: node bench/check-cert-sign.mjs

      - name: Signing on rotated and cropped pages, and saving byte for byte
        working-directory: desktop
        shell: bash
        env:
          PW_TEST_CERTS: ${{ runner.temp }}\certs.json
        run: |
          node bench/check-cert-placement.mjs
          node bench/check-save-bytes.mjs

      - name: Check the app's signed PDFs with pyHanko and OpenSSL
        shell: bash
        run: |
          ls "$RUNNER_TEMP/app-signed"
          python desktop/tests/validate-signed.py "$RUNNER_TEMP/app-signed/Contract (signed).pdf" "$RUNNER_TEMP/app-signed/Contract (signed) (signed) (signed).pdf"
          node desktop/tests/openssl-verify.mjs "$RUNNER_TEMP/app-signed/Contract (signed) (signed) (signed).pdf"

      - name: Screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cert-screens-windows
          path: ${{ runner.temp }}/cert-screens
          if-no-files-found: ignore

      - name: Remove the test IDs
        if: ${{ always() }}
        shell: powershell
        run: desktop/native/win-certs/test-certs.ps1 -Remove -Out "$env:RUNNER_TEMP\certs.json"
