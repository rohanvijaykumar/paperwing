name: Tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

  # The File Explorer thumbnail provider (desktop/native/win-thumbnails):
  # builds it and renders real PDFs through it the way Explorer does
  windows-thumbnails:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and test
        shell: pwsh
        run: desktop/native/win-thumbnails/build.ps1 -Test

  # Signing with certificates in the Windows store (desktop/native/win-certs):
  # the helper's own tests, then test IDs whose keys can't be exported (as on
  # a smart card): RSA, ECDSA P-256/384/521, an older CryptoAPI key, and a
  # login-only and an expired one that mustn't sign. Real PDFs are signed
  # through the helper and each is checked by pyHanko and OpenSSL as well as
  # Paperwing's own validator; then the real app signs with real clicks.
  windows-certs:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HUSKY: 0
      BENCH_TMP: ${{ github.workspace }}/../bench-tmp
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix desktop
          mkdir -p "$BENCH_TMP"

      - name: Build and test the certificate helper
        shell: pwsh
        run: desktop/native/win-certs/build.ps1 -Test

      - name: Bridge tests
        run: node --test desktop/tests/certs.test.mjs

      - name: Create test IDs in the certificate store
        shell: powershell
        run: desktop/native/win-certs/test-certs.ps1 -Create -Out "$env:RUNNER_TEMP\certs.json"

      - name: Sign PDFs through the helper
        shell: bash
        env:
          PW_CERTS_HELPER: ${{ github.workspace }}\desktop\native\win-certs\out\paperwing-certs.exe
          PW_TEST_CERTS: ${{ runner.temp }}\certs.json
          PW_SIGNED_OUT: ${{ runner.temp }}\signed
        run: npx vitest run src/tests/paperwing-cert-helper.test.ts src/tests/paperwing-pdf-sign.test.ts src/tests/paperwing-cms.test.ts

      - name: Check every signed PDF with pyHanko
        shell: bash
        run: |
          python -m pip install --quiet "pyHanko==0.29.1"
          python desktop/tests/validate-signed.py "$RUNNER_TEMP/signed"

      - name: Check every signed PDF with OpenSSL
        shell: bash
        run: node desktop/tests/openssl-verify.mjs "$RUNNER_TEMP/signed"

      - name: Build the web app
        working-directory: desktop
        run: npm run build:web

      - name: Digitally sign in the real app
        working-directory: desktop
        shell: bash
        env:
          PW_TEST_CERTS: ${{ runner.temp }}\certs.json
          PW_SIGNED_OUT: ${{ runner.temp }}\app-signed
          PW_SCREENS: ${{ runner.temp }}\cert-screens
        run: node bench/check-cert-sign.mjs

      - name: Signing on rotated and cropped pages, and saving byte for byte
        working-directory: desktop
        shell: bash
        env:
          PW_TEST_CERTS: ${{ runner.temp }}\certs.json
        run: |
          node bench/check-cert-placement.mjs
          node bench/check-save-bytes.mjs

      - name: Use a certificate as a user would, every result checked (OCR, pyHanko, OpenSSL)
        working-directory: desktop
        shell: bash
        env:
          PW_TEST_CERTS: ${{ runner.temp }}\certs.json
          PW_SCREENS: ${{ runner.temp }}\cert-screens\results
        run: node bench/check-cert-results.mjs

      - name: Check the app's signed PDFs with pyHanko and OpenSSL
        shell: bash
        run: |
          ls "$RUNNER_TEMP/app-signed"
          python desktop/tests/validate-signed.py "$RUNNER_TEMP/app-signed/Contract (signed).pdf" "$RUNNER_TEMP/app-signed/Contract (signed) (signed) (signed).pdf"
          node desktop/tests/openssl-verify.mjs "$RUNNER_TEMP/app-signed/Contract (signed) (signed) (signed).pdf"

      - name: Screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cert-screens-windows
          path: ${{ runner.temp }}/cert-screens
          if-no-files-found: ignore

      - name: Remove the test IDs
        if: ${{ always() }}
        shell: powershell
        run: desktop/native/win-certs/test-certs.ps1 -Remove -Out "$env:RUNNER_TEMP\certs.json"

  # Scanning in the desktop shell (desktop/scan.cjs), and its Windows helper
  # (desktop/scanner/wia.ps1) run for real: with no scanner, it lists none
  windows-scanner:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Scanning tests
        run: node --test desktop/tests/scan.test.mjs

  # The Windows scanner helpers (desktop/native/win-scanner): built with
  # their unit tests, then run for real on a runner with no scanner
  windows-scanner-helper:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build and unit-test the helpers
        run: node desktop/native/win-scanner/build.mjs --test

      - name: Run the helpers (no scanner)
        env:
          PAPERWING_EXPECT_NO_SCANNERS: '1'
          PAPERWING_REQUIRE_SCANNER: '1'
        run: node --test desktop/tests/win-scanner.test.mjs

      - name: Keep the helpers for the TWAIN test
        uses: actions/upload-artifact@v7
        with:
          name: win-scanner-helpers
          path: desktop/native/win-scanner/out
          if-no-files-found: error

  # The helpers against a real TWAIN driver: the TWAIN Working Group's sample
  # scanner (64- and 32-bit), installed on the runner only
  windows-scanner-twain:
    needs: windows-scanner-helper
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Get the helpers
        uses: actions/download-artifact@v8
        with:
          name: win-scanner-helpers
          path: desktop/native/win-scanner/out

      - name: Install the TWAIN sample scanner
        shell: pwsh
        run: |
          # The TWAIN Working Group's own installers (github.com/twain/twain-samples),
          # pinned to a commit and checked against their git object IDs
          $commit = '18352fe4ac6c8ee25311173f730f4d900964005e'
          $installers = @{
            'twainds.win64.installer.msi' = '91447447e40574e3a8347a5841164fa277e09514'
            'twainds.win32.installer.msi' = '798b291e84aa7550db1896e15aaed71ee41c5cc4'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'twain-sample'
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($name in $installers.Keys) {
            $msi = Join-Path $dir $name
            Invoke-WebRequest "https://github.com/twain/twain-samples/raw/$commit/releases/Twain_Ds_sample01_02040100/$name" -OutFile $msi
            $id = (git hash-object $msi).Trim()
            if ($id -ne $installers[$name]) { throw "$name doesn't match: $id" }
            $log = Join-Path $dir "$name.log"
            $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 50; throw "$name failed to install: $($p.ExitCode)" }
          }
          Get-ChildItem -Recurse "$env:WINDIR\twain_32", "$env:WINDIR\twain_64" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-ChildItem "$env:WINDIR\System32\twaindsm.dll", "$env:WINDIR\SysWOW64\twaindsm.dll" -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Scan with it
        env:
          PAPERWING_TWAIN_SAMPLE: '1'
        run: node --test --test-concurrency=1 desktop/tests/win-scanner-twain.test.mjs
