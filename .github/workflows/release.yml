name: Release desktop apps

# Push a tag like v1.0.0 to build Windows and macOS apps and attach them to a
# draft GitHub Release. Review the draft, then click "Publish release".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0
      # Unsigned builds: no code-signing certificate is configured.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install BentoPDF dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build web app
        working-directory: desktop
        run: npm run build:web

      - name: Package desktop app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperwing-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg

  # LibreOffice (~77 MB) isn't in the installers; the app downloads it the
  # first time an Office -> PDF tool is used. Publish it once per engine
  # version as a pre-release (so it never shows up as the "latest" release).
  engine:
    name: Publish on-demand engine files
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upload engine files
        run: |
          TAG=$(node desktop/scripts/engine-info.mjs --tag)
          echo "Engine release: $TAG"
          FILES="public/libreoffice-wasm/soffice.wasm.gz public/libreoffice-wasm/soffice.data.gz"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Engine files ($TAG)" \
              --notes "Downloaded automatically by Paperwing the first time you convert a Word, Excel or PowerPoint file. You don't need to download anything here."
          fi
          # Upload only what's missing: re-uploading would briefly remove a
          # file that installed apps may be downloading
          HAVE=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in $FILES; do
            if echo "$HAVE" | grep -qx "$(basename "$f")"; then
              echo "Already published: $(basename "$f")"
            else
              gh release upload "$TAG" "$f"
            fi
          done

  release:
    name: Create draft release
    needs: [build, engine]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Paperwing ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: artifacts/*
