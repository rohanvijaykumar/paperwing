name: Scanner dev (temporary)

on:
  push:
    branches: ['scan/escl-mac']

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BENCH_TMP: ${{ runner.temp }}/bench-tmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: mkdir -p "$BENCH_TMP"
      - name: Scanner helper
        run: bash desktop/native/mac-scanner/build.sh --test
      - name: eSCL tests
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node --test tests/escl.test.mjs
      - name: eSCL on the real multicast group
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: ESCL_MULTICAST=1 node --test --test-name-pattern="real multicast" tests/escl.test.mjs
      - name: Network scanner through Bonjour
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: bash tests/mac-network-scanner.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: airscan
          path: ${{ runner.temp }}/bench-tmp/airscan

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: eSCL tests
        run: node --test desktop/tests/escl.test.mjs
      - name: Scanning tests
        run: node --test desktop/tests/scan.test.mjs
      - name: eSCL on the real multicast group
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ESCL_MULTICAST: '1'
        run: node --test --test-name-pattern="real multicast" desktop/tests/escl.test.mjs
