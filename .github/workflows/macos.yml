name: macOS

# The desktop app on a Mac: the unit tests, the print tests, every bench
# check (real Electron, real mouse and keyboard), the end-to-end tests, and
# a real print to a virtual network printer. Changes that can't affect the
# app (documentation, screenshots and the scripts that make them) skip it.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'desktop/scripts/gen-*screenshots.mjs'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HUSKY: 0
      BENCH_TMP: ${{ github.workspace }}/../bench-tmp
      PRINTED: /private/tmp/paperwing-printed
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix desktop
          mkdir -p "$BENCH_TMP"

      - name: Unit tests
        run: npm run test:run

      - name: Build the web app
        working-directory: desktop
        run: npm run build:web

      - name: Print tests
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm run test:print

      # Apple's ImageCaptureCore, through the Swift helper: it must build
      # (universal) and, with no scanner attached, list none
      - name: Scanner helper
        if: ${{ !cancelled() }}
        run: bash desktop/native/mac-scanner/build.sh --test

      - name: Scanning tests
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm run test:scan

      # Network scanners without drivers (escl.cjs): against the pretend eSCL
      # scanner, then announced through Bonjour the way a real one is, where
      # Image Capture (the Swift helper) must find and scan it too
      # (tests/mac-network-scanner.sh). macOS doesn't let processes on this
      # runner multicast (Local Network privacy), so there escl.cjs reaches
      # it by its Bonjour name; Windows CI covers multicast discovery.
      - name: Network scanner (eSCL) tests
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: |
          node --test tests/escl.test.mjs
          bash tests/mac-network-scanner.sh

      # Signing with Digital IDs in the Keychain (desktop/native/mac-certs):
      # the Swift helper must build (universal) and pass its own test; then
      # test identities in a keychain of their own sign real PDFs through it,
      # each checked by pyHanko and OpenSSL, and the real app signs with them
      - name: Certificate helper
        if: ${{ !cancelled() }}
        run: bash desktop/native/mac-certs/build.sh --test

      - name: Certificate bridge tests
        if: ${{ !cancelled() }}
        run: node --test desktop/tests/certs.test.mjs

      - name: Test IDs in a keychain
        if: ${{ !cancelled() }}
        run: bash desktop/native/mac-certs/test-keychain.sh create "$RUNNER_TEMP/certs.json"

      - name: Sign PDFs through the helper
        if: ${{ !cancelled() }}
        env:
          PW_CERTS_HELPER: ${{ github.workspace }}/desktop/native/mac-certs/out/paperwing-certs
          PW_TEST_CERTS: ${{ runner.temp }}/certs.json
          PW_SIGNED_OUT: ${{ runner.temp }}/signed
        run: npx vitest run src/tests/paperwing-cert-helper.test.ts

      - name: Check the signed PDFs with pyHanko and OpenSSL
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyHanko==0.29.1"
          "$RUNNER_TEMP/venv/bin/python" desktop/tests/validate-signed.py "$RUNNER_TEMP/signed"
          PATH="$(brew --prefix openssl@3)/bin:$PATH" node desktop/tests/openssl-verify.mjs "$RUNNER_TEMP/signed"

      - name: Digitally sign in the real app
        if: ${{ !cancelled() }}
        working-directory: desktop
        env:
          PW_TEST_CERTS: ${{ runner.temp }}/certs.json
          PW_SIGNED_OUT: ${{ runner.temp }}/app-signed
          PW_SCREENS: ${{ runner.temp }}/cert-screens
        run: |
          node bench/check-cert-sign.mjs
          "$RUNNER_TEMP/venv/bin/python" tests/validate-signed.py "$RUNNER_TEMP/app-signed/Contract (signed) (signed) (signed).pdf"

      - name: Signing on rotated and cropped pages, and saving byte for byte
        if: ${{ !cancelled() }}
        working-directory: desktop
        env:
          PW_TEST_CERTS: ${{ runner.temp }}/certs.json
        run: |
          node bench/check-cert-placement.mjs
          node bench/check-save-bytes.mjs

      - name: Certificate screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cert-screens-macos
          path: ${{ runner.temp }}/cert-screens
          if-no-files-found: ignore

      - name: Remove the test keychain
        if: ${{ always() }}
        run: bash desktop/native/mac-certs/test-keychain.sh remove "$RUNNER_TEMP/certs.json"

      # A network printer on this machine, set as the default: CUPS (as on any
      # Mac) sends its jobs to 127.0.0.1:9100, the way office printers take
      # them, and a small listener saves each job to a file
      - name: Set up a virtual printer
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$PRINTED"
          nohup python3 -u - "$PRINTED" > "$BENCH_TMP/printer.log" 2>&1 <<'PY' &
          import os, socket, sys
          out, n = sys.argv[1], 0
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(('127.0.0.1', 9100))
          s.listen(5)
          while True:
              c, _ = s.accept()
              n += 1
              with open(os.path.join(out, f'job-{n}.out'), 'wb') as f:
                  while b := c.recv(65536):
                      f.write(b)
              c.close()
              print('job', n, flush=True)
          PY
          sleep 1
          ppd=/System/Library/Frameworks/ApplicationServices.framework/Versions/A/Frameworks/PrintCore.framework/Versions/A/Resources/Generic.ppd
          if [ -f "$ppd" ]; then model=(-P "$ppd"); else model=(-m "$(lpinfo -m | grep -i -m1 generic | cut -d' ' -f1)"); fi
          sudo lpadmin -p PaperwingTest -E -v socket://127.0.0.1:9100 "${model[@]}"
          sudo cupsenable PaperwingTest
          sudo cupsaccept PaperwingTest
          sudo lpadmin -d PaperwingTest
          lpstat -p -d

      - name: Print bench, with a real print
        if: ${{ !cancelled() }}
        working-directory: desktop
        env:
          PAPERWING_PRINT_TO: PaperwingTest
        run: node bench/check-print.mjs

      # Two jobs (the printer's paper, then Letter landscape), with pages in them
      - name: What reached the printer
        if: ${{ !cancelled() }}
        run: |
          for i in $(seq 1 60); do [ -z "$(lpstat -o PaperwingTest)" ] && break; sleep 2; done
          lpstat -W completed -o PaperwingTest || true
          cat "$BENCH_TMP/printer.log" || true
          ls -l "$PRINTED"
          jobs=$(ls "$PRINTED" | wc -l | tr -d ' ')
          size=$(cat "$PRINTED"/* 2>/dev/null | wc -c | tr -d ' ')
          pages=$(cat "$PRINTED"/* 2>/dev/null | grep -acE '^%%Page:|/Type ?/Page[^s]' || true)
          echo "jobs: $jobs, $size bytes, $pages page(s)"
          [ "$jobs" -ge 2 ] && [ "$size" -gt 1000 ] && [ "$pages" -ge 2 ]

      - name: Forms bench
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-forms.mjs

      - name: Full screen, What's new and keyboard layouts
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-shell.mjs

      - name: Opening files (and dragging them in from Finder)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-open-running.mjs

      - name: Quality-of-life bench
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-qol.mjs

      - name: Copying highlighted text
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-copy-text.mjs

      - name: Create PDF from scanner
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-scan.mjs

      - name: 'Scanning: settings, presets, insert, append, files, OCR, tools'
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-scan-more.mjs

      - name: 'Scanning: what it makes, checked (area, preview, sizes, colors, filters)'
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-scan-output.mjs

      - name: Scanning a network scanner
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-scan-network.mjs

      - name: 1.2 interface bench
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-ui12.mjs

      - name: Branding bench
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-branding.mjs

      - name: The desktop app's words (no upload or download)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-wording.mjs

      - name: Update bench
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: node bench/check-update.mjs

      - name: Viewer, engine, signatures and results benches
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: |
          node bench/make-fixture.mjs "$BENCH_TMP/long.pdf" 60
          node bench/check-view.mjs "$BENCH_TMP/long.pdf"
          node bench/check-engine.mjs ../src/tests/fixtures/sample.pdf
          node bench/check-signatures.mjs ../src/tests/fixtures/sample.pdf
          node bench/check-results.mjs ../src/tests/fixtures/sample.pdf

      - name: End-to-end tests
        if: ${{ !cancelled() }}
        run: |
          npx vite preview --port 4173 --strictPort > "$BENCH_TMP/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          PAPERWING_URL=http://localhost:4173 npm run test:e2e --prefix desktop

      - name: Upload what was printed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-printed
          path: /private/tmp/paperwing-printed
          if-no-files-found: ignore
