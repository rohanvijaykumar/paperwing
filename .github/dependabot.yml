version: 2
updates:
  # Desktop shell (Electron, packaging, e2e tooling). The repository root holds
  # BentoPDF's dependencies, which are updated by merging BentoPDF releases.
  - package-ecosystem: 'npm'
    directory: '/desktop'
    schedule:
      interval: 'weekly'
    groups:
      desktop-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
